# paq manifest used by e2e/Dockerfile.devtools: two Node and two JDK lines
# side by side, plus common CLI tools. Every version is pinned, so paq
# downloads straight from the release URLs with no GitHub API calls.

[defaults]
bin = "/usr/local/bin"
opt = "/opt/paq"

[apps.node20]
use = "node"
version = "20.20.2"
dest = "/opt/paq/node20"

[apps.node24]
use = "node"
version = "24.21.0"
dest = "/opt/paq/node24"

[apps.jdk17]
use = "temurin-17"
version = "17.0.20+8"
dest = "/opt/paq/jdk17"

[apps.jdk21]
use = "temurin-21"
version = "21.0.12+8"
dest = "/opt/paq/jdk21"

[apps.bat]
use = "bat"
version = "0.26.1"

[apps.fd]
use = "fd"
version = "10.5.0"

[apps.rg]
use = "ripgrep"
version = "15.2.0"

[apps.jq]
use = "jq"
version = "1.8.2"

[apps.delta]
use = "delta"
version = "0.20.1"

[apps.gh]
use = "gh"
version = "2.102.0"
