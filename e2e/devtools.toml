# paq manifest used by e2e/Dockerfile.devtools. Every version is pinned.
# Multi-version tools (Node, JDK) install to /opt/paq/<tool>-<version>; the
# Dockerfile links /opt/paq/<app> (e.g. /opt/paq/node-20) to each of them.
# Recipes for gradle and awscli are in e2e/devtools-registry.toml.

[defaults]
bin = "/usr/local/bin"
opt = "/opt/paq"

[apps.node-20]
use = "node"
version = "20.20.2"
dest = "/opt/paq/node-{{version}}"

[apps.node-24]
use = "node"
version = "24.22.0"
dest = "/opt/paq/node-{{version}}"

[apps.jdk-17]
use = "temurin-17"
version = "17.0.20.1+1"
dest = "/opt/paq/jdk-{{version}}"

[apps.jdk-21]
use = "temurin-21"
version = "21.0.12.1+1"
dest = "/opt/paq/jdk-{{version}}"

[apps.maven]
use = "maven"
version = "3.10.0"
dest = "/opt/paq/maven"

[apps.gradle]
use = "gradle"
version = "9.8.1"
dest = "/opt/paq/gradle"

[apps.awscli]
use = "awscli"
version = "2.37.9"
dest = "/opt/paq/awscli"
